<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gallery Admin | POSE Photobooth</title>
  <link rel="icon" href="../../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f7f7f5;
      --surface:#fff;
      --surface-2:#f5f5f3;
      --text:#151515;
      --muted:#777873;
      --line:#e4e4df;
      --line-strong:#d5d5cf;
      --ink:#161616;
      --ok:#27643a;
      --warn:#8a5a13;
      --danger:#a12b2b;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    .shell{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:34px 0 72px}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:16px;min-width:0}
    .brand img{width:94px;height:auto;display:block}
    .brand-copy{min-width:0}
    .brand h1{font-size:1.45rem;line-height:1.1;margin:0;letter-spacing:-.045em;font-weight:800}
    .brand p{margin:6px 0 0;color:var(--muted);font-size:.82rem}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    .btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750;font-size:.8rem;min-height:42px;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
    .btn:hover{background:#f3f3f1;border-color:#c5c5bf}
    .btn:active{transform:translateY(1px)}
    .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
    .btn.primary:hover{background:#2a2a2a;border-color:#2a2a2a}
    .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .btn.ghost:hover{background:#efefec;color:var(--text)}
    .btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .btn.small{min-height:38px;padding:8px 11px;font-size:.74rem}

    .overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 20px}
    .metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
    .metric-label{font-size:.69rem;font-weight:750;text-transform:uppercase;letter-spacing:.09em;color:#8a8a84}
    .metric-value{margin-top:7px;font-size:1.45rem;line-height:1;font-weight:800;letter-spacing:-.045em}
    .metric-note{margin-top:6px;color:var(--muted);font-size:.7rem}

    .controlbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:10px;margin-bottom:10px}
    .search-wrap{position:relative;min-width:0;flex:1}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#8b8b86;pointer-events:none}
    .search{width:100%;border:0;background:transparent;border-radius:10px;padding:11px 12px 11px 40px;outline:none;color:var(--text);font-size:.84rem}
    .search::placeholder{color:#a0a09b}
    .search:focus{background:#f7f7f5;box-shadow:inset 0 0 0 1px #d7d7d2}
    .status{min-height:24px;margin:0 2px 14px;color:var(--muted);font-size:.74rem;display:flex;align-items:center;gap:7px}
    .status::before{content:"";width:6px;height:6px;border-radius:50%;background:#b9b9b3;flex:0 0 auto}
    .status.error{color:var(--danger)}.status.error::before{background:var(--danger)}
    .status.ok{color:var(--ok)}.status.ok::before{background:var(--ok)}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease}
    .card:hover{border-color:#d4d4ce;box-shadow:0 8px 24px rgba(0,0,0,.035)}
    .card-main{padding:16px 17px 14px}
    .card-head{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:13px;align-items:start}
    .cover{width:66px;height:66px;border-radius:11px;background:#ecece8;object-fit:cover;display:block;border:1px solid #e4e4df}
    .title-wrap{min-width:0;padding-top:2px}
    .title{margin:0;font-size:.96rem;line-height:1.33;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{margin-top:5px;color:#85857f;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .badge{padding:4px 7px;border-radius:999px;background:#f1f1ee;font-size:.64rem;font-weight:750;color:#666761;line-height:1}
    .published-dot{align-self:start;margin-top:3px;width:8px;height:8px;border-radius:50%;background:#303030;box-shadow:0 0 0 4px #eeeeeb}
    .published-dot.off{background:#c8c8c2}

    .settings{margin-top:15px;border-top:1px solid #eeeeea;padding-top:14px}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field label{display:block;font-size:.66rem;font-weight:750;color:#76766f;margin:0 0 6px}
    .field input[type="text"],.field input[type="date"],.field input[type="password"]{width:100%;height:42px;border:1px solid var(--line-strong);border-radius:10px;padding:0 11px;background:#fff;color:var(--text);font-size:.77rem;outline:none;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
    .field input::placeholder{color:#aaa9a3}
    .field input:focus{border-color:#9f9f99;box-shadow:0 0 0 3px rgba(0,0,0,.04);background:#fff}
    .field.full{grid-column:1/-1}

    .toggle-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:2px}
    .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid #e7e7e2;background:#fafaf8;border-radius:11px;cursor:pointer;min-width:0}
    .toggle-label{min-width:0}
    .toggle-title{display:block;font-size:.72rem;font-weight:750;color:#33332f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toggle-sub{display:block;margin-top:2px;font-size:.61rem;color:#96968f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .switch{position:relative;width:34px;height:20px;flex:0 0 auto}
    .switch input{position:absolute;opacity:0;pointer-events:none}
    .switch-ui{position:absolute;inset:0;border-radius:999px;background:#d8d8d2;transition:.18s ease}
    .switch-ui::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:.18s ease}
    .switch input:checked + .switch-ui{background:#171717}
    .switch input:checked + .switch-ui::after{transform:translateX(14px)}
    .switch input:focus-visible + .switch-ui{outline:3px solid rgba(0,0,0,.12);outline-offset:2px}

    .client-link{margin-top:11px;padding:10px 11px;background:#f5f5f2;border:1px solid #e6e6e0;border-radius:10px;font-size:.68rem;line-height:1.45;word-break:break-all;color:#6b6b65}
    .card-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 17px;border-top:1px solid #eeeeea;background:#fcfcfa}
    .card-actions .left,.card-actions .right{display:flex;align-items:center;gap:7px;min-width:0}
    .save-state{font-size:.65rem;color:#9a9a94;white-space:nowrap}
    .hidden{display:none!important}
    .empty{grid-column:1/-1;background:var(--surface);border:1px dashed #d2d2cc;border-radius:16px;padding:42px;text-align:center;color:#7d7d77;font-size:.84rem}

    @media(max-width:980px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
    @media(max-width:700px){
      .shell{width:min(100% - 22px,1240px);padding-top:20px}
      .topbar{align-items:flex-start;flex-direction:column;margin-bottom:18px}
      .top-actions{width:100%}.top-actions .btn{flex:1}
      .overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:13px}.metric-value{font-size:1.25rem}
      .controlbar{padding:8px;flex-wrap:wrap}.controlbar .btn{width:100%}
      .card-head{grid-template-columns:58px minmax(0,1fr) auto}.cover{width:58px;height:58px}
      .settings-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
      .toggle-row{grid-template-columns:1fr}
      .card-actions{align-items:stretch;flex-direction:column}.card-actions .left,.card-actions .right{width:100%}.card-actions .btn{flex:1}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="../../assets/images/pose-logo.png" alt="POSE Photobooth" />
        <div class="brand-copy">
          <h1>Gallery Admin</h1>
          <p>Manage visibility, access and gallery settings.</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="open-gallery">Open Gallery</button>
        <button class="btn primary" id="refresh">Refresh Drive Index</button>
      </div>
    </header>

    <section class="overview" aria-label="Gallery overview">
      <div class="metric"><div class="metric-label">Events</div><div class="metric-value" id="metric-events">—</div><div class="metric-note">Loaded in admin</div></div>
      <div class="metric"><div class="metric-label">Published</div><div class="metric-value" id="metric-published">—</div><div class="metric-note">Visible to visitors</div></div>
      <div class="metric"><div class="metric-label">Protected</div><div class="metric-value" id="metric-protected">—</div><div class="metric-note">PIN enabled</div></div>
      <div class="metric"><div class="metric-label">Media</div><div class="metric-value" id="metric-media">—</div><div class="metric-note">Photos & videos</div></div>
    </section>

    <div class="controlbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.15A6.5 6.5 0 1 1 5 11.5a6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input class="search" id="search" type="search" placeholder="Search events, type or date…" aria-label="Search events" />
      </div>
      <button class="btn" id="reload">Reload</button>
    </div>

    <p class="status" id="status">Loading events…</p>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <script src="../assets/config.js"></script>
  <script>
  (()=>{
    const endpoint=window.POSE_GALLERY?.endpoint||'';
    const token=new URLSearchParams(location.search).get('token')||'';
    const grid=document.querySelector('#grid');
    const status=document.querySelector('#status');
    const search=document.querySelector('#search');
    const refresh=document.querySelector('#refresh');
    const reload=document.querySelector('#reload');
    const metrics={
      events:document.querySelector('#metric-events'),
      published:document.querySelector('#metric-published'),
      protected:document.querySelector('#metric-protected'),
      media:document.querySelector('#metric-media')
    };
    let events=[];

    document.querySelector('#open-gallery').addEventListener('click',()=>location.href='../');
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function setStatus(msg,type=''){status.textContent=msg;status.className='status'+(type?' '+type:'')}
    function formatNumber(value){return new Intl.NumberFormat().format(Number(value)||0)}
    function updateMetrics(){
      metrics.events.textContent=formatNumber(events.length);
      metrics.published.textContent=formatNumber(events.filter(e=>e.published!==false).length);
      metrics.protected.textContent=formatNumber(events.filter(e=>e.pinEnabled).length);
      metrics.media.textContent=formatNumber(events.reduce((sum,e)=>sum+(Number(e.itemCount)||0),0));
    }
    async function apiGet(){const u=new URL(endpoint);u.searchParams.set('admin','1');u.searchParams.set('token',token);const r=await fetch(u,{cache:'no-store'});return r.json()}
    async function apiPost(body){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token})});return r.json()}

    function render(){
      const q=search.value.trim().toLowerCase();
      const rows=events.filter(e=>!q||(e.eventName+' '+e.eventType+' '+e.eventDate).toLowerCase().includes(q));
      if(!rows.length){grid.innerHTML='<div class="empty">No matching events.</div>';return}
      grid.innerHTML=rows.map(e=>`<article class="card" data-id="${esc(e.id)}">
        <div class="card-main">
          <div class="card-head">
            <img class="cover" loading="lazy" decoding="async" src="${esc(e.coverUrl||'../../assets/images/photobooth.webp')}" alt="" />
            <div class="title-wrap">
              <h2 class="title" title="${esc(e.eventName)}">${esc(e.eventName)}</h2>
              <div class="meta">${esc(e.eventDate||'No date')} · ${formatNumber(e.itemCount||0)} items</div>
              <div class="badges"><span class="badge">${esc(e.eventType)}</span><span class="badge">${formatNumber(e.photoCount||0)} photos</span><span class="badge">${formatNumber(e.videoCount||0)} videos</span></div>
            </div>
            <span class="published-dot ${e.published===false?'off':''}" title="${e.published===false?'Unpublished':'Published'}"></span>
          </div>

          <div class="settings">
            <div class="settings-grid">
              <div class="field"><label>Expiry date</label><input type="date" data-field="expires" value="${esc(e.expires||'')}" /></div>
              <div class="field"><label>Cover file ID</label><input type="text" data-field="coverFileId" value="${esc(e.coverFileId||'')}" placeholder="Google Drive file ID" /></div>
              <div class="field full"><label>New PIN <span style="font-weight:500;color:#aaa">(optional)</span></label><input type="password" data-field="newPin" placeholder="Leave blank to keep the current PIN" autocomplete="new-password" /></div>

              <div class="toggle-row">
                <label class="toggle">
                  <span class="toggle-label"><span class="toggle-title">Published</span><span class="toggle-sub">Visible in gallery</span></span>
                  <span class="switch"><input type="checkbox" data-field="published" ${e.published!==false?'checked':''} /><span class="switch-ui"></span></span>
                </label>
                <label class="toggle">
                  <span class="toggle-label"><span class="toggle-title">PIN protection</span><span class="toggle-sub">Require client PIN</span></span>
                  <span class="switch"><input type="checkbox" data-field="pinEnabled" ${e.pinEnabled?'checked':''} /><span class="switch-ui"></span></span>
                </label>
                <label class="toggle">
                  <span class="toggle-label"><span class="toggle-title">Downloads</span><span class="toggle-sub">Allow downloads</span></span>
                  <span class="switch"><input type="checkbox" data-field="downloadsEnabled" ${e.downloadsEnabled!==false?'checked':''} /><span class="switch-ui"></span></span>
                </label>
              </div>
            </div>
            <div class="client-link hidden" data-link></div>
          </div>
        </div>
        <div class="card-actions">
          <div class="left"><button class="btn small" data-client>Generate client link</button></div>
          <div class="right"><span class="save-state" data-save-state></span><button class="btn primary small" data-save>Save changes</button></div>
        </div>
      </article>`).join('');
    }

    async function load(){
      if(!endpoint||!token){setStatus('Admin link is incomplete. Run setupGalleryAdmin() in Apps Script to create one.','error');return}
      setStatus('Loading events…');
      try{
        const d=await apiGet();
        if(!d.ok)throw new Error(d.message||'Unable to load admin data.');
        events=d.events||[];
        updateMetrics();
        render();
        setStatus(`${events.length} events loaded.`);
      }catch(e){setStatus(e.message||'Unable to load admin data.','error')}
    }

    search.addEventListener('input',render);
    reload.addEventListener('click',load);

    refresh.addEventListener('click',async()=>{
      refresh.disabled=true;
      const old=refresh.textContent;
      refresh.textContent='Refreshing…';
      setStatus('Scanning Google Drive and rebuilding index…');
      try{
        const d=await apiPost({action:'adminRefreshIndex'});
        if(!d.ok)throw new Error(d.message);
        setStatus(`${d.message} ${d.count??''}`,'ok');
        await load();
      }catch(e){setStatus(e.message||'Refresh failed.','error')}
      finally{refresh.disabled=false;refresh.textContent=old}
    });

    grid.addEventListener('click',async ev=>{
      const card=ev.target.closest('.card');
      if(!card)return;
      const id=card.dataset.id;

      if(ev.target.matches('[data-save]')){
        const b=ev.target;
        const saveState=card.querySelector('[data-save-state]');
        b.disabled=true;
        const old=b.textContent;
        b.textContent='Saving…';
        saveState.textContent='';
        const val=n=>card.querySelector(`[data-field="${n}"]`);
        try{
          const d=await apiPost({
            action:'adminUpdateEvent',eventId:id,expires:val('expires').value,
            coverFileId:val('coverFileId').value.trim(),newPin:val('newPin').value.trim(),
            published:val('published').checked,pinEnabled:val('pinEnabled').checked,
            downloadsEnabled:val('downloadsEnabled').checked
          });
          if(!d.ok)throw new Error(d.message);
          val('newPin').value='';
          saveState.textContent='Saved';
          setStatus(d.message,'ok');
          await load();
        }catch(e){saveState.textContent='';setStatus(e.message||'Save failed.','error')}
        finally{b.disabled=false;b.textContent=old}
      }

      if(ev.target.matches('[data-client]')){
        const b=ev.target;
        b.disabled=true;
        const old=b.textContent;
        b.textContent='Generating…';
        try{
          const d=await apiPost({action:'adminGenerateClientLink',eventId:id});
          if(!d.ok)throw new Error(d.message);
          const el=card.querySelector('[data-link]');
          el.textContent=d.link;
          el.classList.remove('hidden');
          setStatus('New client management link generated.','ok');
        }catch(e){setStatus(e.message||'Unable to generate client link.','error')}
        finally{b.disabled=false;b.textContent=old}
      }
    });

    load();
  })();
  </script>
</body>
</html>
