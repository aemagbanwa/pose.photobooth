<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gallery Admin | POSE Photobooth</title>
  <link rel="icon" href="../../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f6f6f4;color:#171717;font-family:Manrope,Arial,sans-serif}
    button,input{font:inherit} button{cursor:pointer}.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 64px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:100px;height:auto}.brand h1{font-size:1.35rem;margin:0;letter-spacing:-.03em}.brand p{margin:3px 0 0;color:#777;font-size:.82rem}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #d8d8d5;background:#fff;color:#181818;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.84rem;min-height:42px}.btn:hover{border-color:#aaa}.btn.primary{background:#171717;color:white;border-color:#171717}.btn:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-bottom:16px}.search{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 14px;outline:none}.search:focus{border-color:#171717;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
    .status{min-height:22px;color:#737373;font-size:.83rem;margin:0 0 12px}.status.error{color:#a52121}.status.ok{color:#24632d}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e3e3df;border-radius:18px;padding:18px}.card-head{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:16px}.cover{width:72px;height:72px;border-radius:12px;background:#eee;object-fit:cover}.title{margin:0;font-size:1rem;line-height:1.35}.meta{margin-top:5px;color:#858585;font-size:.76rem}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:4px 7px;border-radius:999px;background:#f0f0ee;font-size:.68rem;font-weight:700;color:#555}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:.72rem;font-weight:700;color:#666;margin-bottom:6px}.field input[type="text"],.field input[type="date"],.field input[type="password"]{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 11px;min-height:42px;outline:none}.field input:focus{border-color:#171717}.switches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;padding:4px 0}.check{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:650}.check input{width:18px;height:18px;accent-color:#171717}
    .card-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;padding-top:14px;border-top:1px solid #eee}.small{padding:8px 10px;min-height:38px;font-size:.76rem}.client-link{margin-top:10px;font-size:.72rem;word-break:break-all;color:#666}.hidden{display:none!important}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccc;border-radius:16px;padding:34px;text-align:center;color:#777}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}.controls{grid-template-columns:1fr}.shell{width:min(100% - 22px,1180px);padding-top:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><img src="../../assets/images/pose-logo.png" alt="POSE Photobooth"><div><h1>Gallery Admin</h1><p>Manage event visibility, privacy and client access.</p></div></div>
      <div class="actions"><button class="btn" id="open-gallery">Open Gallery</button><button class="btn primary" id="refresh">Refresh Drive Index</button></div>
    </header>
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="Search events…" aria-label="Search events"><button class="btn" id="reload">Reload</button></div>
    <p class="status" id="status">Loading events…</p>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>
  <script src="../assets/config.js"></script>
  <script>
  (()=>{
    const endpoint=window.POSE_GALLERY?.endpoint||'';
    const token=new URLSearchParams(location.search).get('token')||'';
    const grid=document.querySelector('#grid'), status=document.querySelector('#status'), search=document.querySelector('#search');
    const refresh=document.querySelector('#refresh'), reload=document.querySelector('#reload'); let events=[];
    document.querySelector('#open-gallery').addEventListener('click',()=>location.href='../');
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function setStatus(msg,type=''){status.textContent=msg;status.className='status'+(type?' '+type:'')}
    async function apiGet(){const u=new URL(endpoint);u.searchParams.set('admin','1');u.searchParams.set('token',token);const r=await fetch(u,{cache:'no-store'});return r.json()}
    async function apiPost(body){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token})});return r.json()}
    function render(){const q=search.value.trim().toLowerCase();const rows=events.filter(e=>!q||(e.eventName+' '+e.eventType+' '+e.eventDate).toLowerCase().includes(q));
      if(!rows.length){grid.innerHTML='<div class="empty">No matching events.</div>';return}
      grid.innerHTML=rows.map(e=>`<article class="card" data-id="${esc(e.id)}">
        <div class="card-head"><img class="cover" loading="lazy" src="${esc(e.coverUrl||'../../assets/images/photobooth.webp')}" alt=""><div><h2 class="title">${esc(e.eventName)}</h2><div class="meta">${esc(e.eventDate||'No date')} · ${e.itemCount||0} items</div><div class="badges"><span class="badge">${esc(e.eventType)}</span><span class="badge">${e.photoCount||0} photos</span><span class="badge">${e.videoCount||0} videos</span></div></div></div>
        <div class="controls">
          <div class="field"><label>Expiry date</label><input type="date" data-field="expires" value="${esc(e.expires||'')}"></div>
          <div class="field"><label>Cover file ID</label><input type="text" data-field="coverFileId" value="${esc(e.coverFileId||'')}" placeholder="Google Drive file ID"></div>
          <div class="field"><label>New PIN (optional)</label><input type="password" data-field="newPin" placeholder="Leave blank to keep current PIN"></div>
          <div class="switches"><label class="check"><input type="checkbox" data-field="published" ${e.published!==false?'checked':''}> Published</label><label class="check"><input type="checkbox" data-field="pinEnabled" ${e.pinEnabled?'checked':''}> PIN protection</label><label class="check"><input type="checkbox" data-field="downloadsEnabled" ${e.downloadsEnabled!==false?'checked':''}> Downloads</label></div>
        </div>
        <div class="client-link hidden" data-link></div>
        <div class="card-actions"><button class="btn small" data-client>Generate client link</button><button class="btn primary small" data-save>Save changes</button></div>
      </article>`).join('');
    }
    async function load(){if(!endpoint||!token){setStatus('Admin link is incomplete. Run setupGalleryAdmin() in Apps Script to create one.','error');return}setStatus('Loading events…');try{const d=await apiGet();if(!d.ok)throw new Error(d.message||'Unable to load admin data.');events=d.events||[];render();setStatus(`${events.length} events loaded.`)}catch(e){setStatus(e.message||'Unable to load admin data.','error')}}
    search.addEventListener('input',render);reload.addEventListener('click',load);
    refresh.addEventListener('click',async()=>{refresh.disabled=true;setStatus('Scanning Google Drive and rebuilding index…');try{const d=await apiPost({action:'adminRefreshIndex'});if(!d.ok)throw new Error(d.message);setStatus(`${d.message} ${d.count??''}`,'ok');await load()}catch(e){setStatus(e.message||'Refresh failed.','error')}finally{refresh.disabled=false}});
    grid.addEventListener('click',async ev=>{const card=ev.target.closest('.card');if(!card)return;const id=card.dataset.id;
      if(ev.target.matches('[data-save]')){const b=ev.target;b.disabled=true;setStatus('Saving event settings…');const val=n=>card.querySelector(`[data-field="${n}"]`);try{const d=await apiPost({action:'adminUpdateEvent',eventId:id,expires:val('expires').value,coverFileId:val('coverFileId').value.trim(),newPin:val('newPin').value.trim(),published:val('published').checked,pinEnabled:val('pinEnabled').checked,downloadsEnabled:val('downloadsEnabled').checked});if(!d.ok)throw new Error(d.message);val('newPin').value='';setStatus(d.message,'ok');await load()}catch(e){setStatus(e.message||'Save failed.','error')}finally{b.disabled=false}}
      if(ev.target.matches('[data-client]')){const b=ev.target;b.disabled=true;try{const d=await apiPost({action:'adminGenerateClientLink',eventId:id});if(!d.ok)throw new Error(d.message);const el=card.querySelector('[data-link]');el.textContent=d.link;el.classList.remove('hidden');setStatus('New client management link generated.','ok')}catch(e){setStatus(e.message||'Unable to generate client link.','error')}finally{b.disabled=false}}
    });
    load();
  })();
  </script>
</body>
</html>
